[package]
name = "placebo"
version = "0.0.1"
edition = "2024"
publish = false
description = "An experimental Rust/browser contract for HTML fragment updates"

[workspace]
members = ["placebo-macros"]

[features]
dev = ["dep:notify", "dep:tower-livereload", "dep:tokio", "dep:nix", "dep:syn", "dep:proc-macro2"]

[lib]
path = "src/placebo.rs"

[dependencies]
placebo-macros = { path = "placebo-macros" }
axum = "0.8.9"
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "2.0.119", features = ["full", "visit"], optional = true }
proc-macro2 = { version = "1.0.107", features = ["span-locations"], optional = true }
notify = { version = "8.2.0", optional = true }
tower-livereload = { version = "0.10.3", optional = true }
tokio = { version = "1.53.1", optional = true, features = ["macros", "rt", "signal", "process", "io-util", "sync", "time"] }
serde_html_form = "0.4.1"
form_urlencoded = "1.2.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", optional = true, features = ["signal", "process"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5.3", features = ["util"] }

[[example]]
name = "search"
path = "examples/search.rs"

[[example]]
name = "editors"
path = "examples/editors.rs"

[[bin]]
name = "placebo"
path = "src/bin/placebo.rs"
required-features = ["dev"]

[[example]]
name = "controls"
path = "examples/controls.rs"
