[package]
name = "placebo"
version = "0.0.1"
edition = "2024"
publish = false
description = "An experimental Rust/browser contract for HTML fragment updates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fairhill1/placebo"

[workspace]
members = ["placebo-macros", "template"]

[features]
dev = ["dep:notify", "dep:tower-livereload", "tokio/process", "tokio/signal", "tokio/io-util", "dep:nix"]
# `time::Date` as a form field, for date controls.
time = ["dep:time"]

[dependencies]
placebo-macros = { path = "placebo-macros" }
axum = "0.8.9"
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
notify = { version = "8.2.0", optional = true }
tower-livereload = { version = "0.10.3", optional = true }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
serde_html_form = "0.4.1"
form_urlencoded = "1.2.2"
multer = "3.1.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
time = { version = "0.3.55", optional = true, features = ["serde-human-readable"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", optional = true, features = ["signal", "process"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[[example]]
name = "search"
path = "examples/search.rs"

[[example]]
name = "editors"
path = "examples/editors.rs"

[[bin]]
name = "placebo"
path = "src/bin/placebo/main.rs"
required-features = ["dev"]

[[example]]
name = "controls"
path = "examples/controls.rs"
