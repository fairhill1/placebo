[package]
name = "starter"
version = "0.1.0"
edition = "2024"
publish = false

[features]
dev = ["placebo/dev"]

[dependencies]
placebo = { path = ".." }
axum = "0.8.9"
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
